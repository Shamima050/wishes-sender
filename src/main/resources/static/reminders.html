<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WishesSender - Reminders</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <div class="row space-between">
      <h1>🔔 Reminders</h1>
      <div class="row">
        <button class="btn-outline" onclick="checkNow()">Run scheduler now</button>
        <button class="btn-outline" onclick="readAll()">Mark all read</button>
      </div>
    </div>
    <p class="muted">The scheduler checks every minute and reminds you on the day of an event and
      <span id="daysBefore">1</span> day(s) before. Change this in <a href="settings.html">Settings</a>.</p>

    <div class="card">
      <div id="list"></div>
      <label style="display:block;margin-top:10px">
        <input type="checkbox" id="showCleared" onchange="loadNotifications()"> Show cleared reminders
      </label>
    </div>

    <div class="card">
      <h2>Search & filter events</h2>
      <div class="row">
        <select id="days" style="flex:1" onchange="loadEvents()">
          <option value="7">Next 7 days</option>
          <option value="30" selected>Next 30 days</option>
          <option value="90">Next 3 months</option>
          <option value="366">Next 12 months</option>
        </select>
        <select id="type" style="flex:1" onchange="loadEvents()">
          <option value="">All types</option><option value="BIRTHDAY">Birthday</option>
          <option value="ANNIVERSARY">Anniversary</option><option value="FESTIVAL">Festival</option>
          <option value="CUSTOM">Custom</option>
        </select>
      </div>
      <div id="events"></div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  async function loadNotifications() {
    // Cleared reminders ("Mark all read" or a wish was sent) are hidden unless the box is ticked
    const showCleared = document.getElementById('showCleared').checked;
    const list = await api('/api/notifications' + (showCleared ? '?includeCleared=true' : ''));
    document.getElementById('list').innerHTML = list.map(n =>
      '<div class="list-item ' + (n.is_read ? '' : 'unread') + '"' + (n.is_cleared ? ' style="opacity:.55"' : '') + '>' +
      '<div>' + eventIcon(n.event_type) + ' <b>' + esc(n.message) + '</b>' +
      (n.is_cleared ? ' <span class="tag">cleared</span>' : '') + '<br>' +
      '<span class="muted">Event date: ' + fmtDate(n.for_date) + '</span></div>' +
      '<div class="row">' +
      '<a class="btn btn-small" href="wish.html?connectionId=' + n.connection_id + '&eventId=' + n.event_id + '">Send wish</a>' +
      (n.is_read ? '' : '<button class="btn-small btn-outline" onclick="markRead(' + n.id + ')">Read</button>') +
      '</div></div>'
    ).join('') || '<p class="muted">' + (showCleared ? 'No reminders yet.' : 'You are all caught up 🎉') + '</p>';
  }

  async function loadEvents() {
    const days = document.getElementById('days').value;
    const type = document.getElementById('type').value;
    const list = await api('/api/events/upcoming?days=' + days + '&type=' + type);
    document.getElementById('events').innerHTML = list.map(e =>
      '<div class="list-item"><div>' + eventIcon(e.event_type) + ' <b>' + esc(e.connection_name) + '</b> - ' +
      esc(e.title) + '<br><span class="muted">' + fmtDate(e.next_date) + '</span></div>' +
      '<span class="tag ' + (e.days_left <= 1 ? 'coral' : '') + '">' + daysText(e.days_left) + '</span></div>'
    ).join('') || '<p class="muted">No events in this range.</p>';
  }

  async function markRead(id) {
    await api('/api/notifications/' + id + '/read', 'POST');
    location.reload();
  }

  // Marks everything read AND removes it from the list
  async function readAll() {
    const r = await api('/api/notifications/read-all', 'POST');
    toast(r.cleared + ' reminder(s) cleared');
    setTimeout(() => location.reload(), 800);
  }

  async function checkNow() {
    const r = await api('/api/notifications/check-now', 'POST');
    toast(r.created + ' new reminder(s)');
    setTimeout(() => location.reload(), 800);
  }

  async function start() {
    await loadLayout('reminders');
    const s = await api('/api/settings');
    document.getElementById('daysBefore').textContent = s.remind_days_before;
    loadNotifications();
    loadEvents();
  }
  start();
</script>
</body>
</html>
