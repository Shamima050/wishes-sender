<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WishesSender - Festivals</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <h1>🎉 Upcoming festivals</h1>
    <p class="muted">Open a person's profile to add a festival to them. Festivals are suggested by their religion.</p>
    <div id="chips"></div>
    <div class="card"><table id="table"></table></div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  const religions = ['All', 'Islam', 'Hinduism', 'Christian', 'Buddhism'];
  let current = '';

  function renderChips() {
    document.getElementById('chips').innerHTML = religions.map(r => {
      const value = r === 'All' ? '' : r;
      return '<span class="chip ' + (value === current ? 'active' : '') +
             '" onclick="current=\'' + value + '\'; renderChips(); load()">' + r + '</span>';
    }).join('');
  }

  async function load() {
    const list = await api('/api/festivals?religion=' + current);
    document.getElementById('table').innerHTML =
      '<tr><th>Festival</th><th>Date</th><th>Religion</th><th>Region</th></tr>' +
      list.map(f => '<tr><td>' + esc(f.name) + '</td><td>' + fmtDate(f.festival_date) + '</td>' +
        '<td><span class="tag">' + esc(f.religion) + '</span></td><td>' + esc(f.region) + '</td></tr>').join('');
  }

  async function start() {
    await loadLayout('festivals');
    renderChips();
    load();
  }
  start();
</script>
</body>
</html>
