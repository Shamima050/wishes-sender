<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WishesSender - Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <h1 id="greeting">Hello!</h1>
    <p class="muted" id="today"></p>

    <!-- Stat widgets -->
    <div class="grid" style="margin:18px 0">
      <div class="card stat"><div class="num" id="statConnections">0</div><div class="muted">Connections</div></div>
      <div class="card stat"><div class="num" id="statEvents">0</div><div class="muted">Events saved</div></div>
      <div class="card stat"><div class="num" id="statUpcoming">0</div><div class="muted">Next 30 days</div></div>
      <div class="card stat"><div class="num" id="statSent">0</div><div class="muted">Wishes sent</div></div>
    </div>

    <!-- Today's celebrations -->
    <div id="todayBox"></div>

    <div class="grid-2">
      <div class="card">
        <h2>📅 Upcoming (next 30 days)</h2>
        <div id="upcoming"></div>
      </div>
      <div class="card">
        <h2>💌 Recent wishes</h2>
        <div id="recent"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  async function load() {
    const me = await loadLayout('home');
    const hour = new Date().getHours();
    const part = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greeting').textContent = part + ', ' + me.name + ' 👋';
    document.getElementById('today').textContent = new Date().toDateString();

    const d = await api('/api/dashboard');
    document.getElementById('statConnections').textContent = d.totalConnections;
    document.getElementById('statEvents').textContent = d.totalEvents;
    document.getElementById('statUpcoming').textContent = d.upcoming.length + d.today.length;
    document.getElementById('statSent').textContent = d.wishesSent;

    // Today's celebration cards
    let html = '';
    for (const e of d.today) {
      html += '<div class="card today row space-between">' +
        '<div><span class="tag gold">TODAY</span>' +
        '<h2 style="margin-top:8px">' + eventIcon(e.event_type) + ' ' + esc(e.connection_name) + ' - ' + esc(e.title) + '</h2>' +
        '<span class="muted">' + esc(e.relation) + '</span></div>' +
        '<div class="row">' +
        '<a class="btn btn-coral" href="wish.html?connectionId=' + e.connection_id + '&eventId=' + e.id + '">Send Wish</a>' +
        '<a class="btn btn-outline" href="person.html?id=' + e.connection_id + '#gifts">Gift Ideas</a>' +
        '</div></div>';
    }
    document.getElementById('todayBox').innerHTML = html;

    // Upcoming list
    html = '';
    for (const e of d.upcoming) {
      html += '<div class="list-item">' +
        '<div class="row"><div class="avatar">' + initials(e.connection_name) + '</div>' +
        '<div><b>' + esc(e.connection_name) + '</b><br><span class="muted">' + eventIcon(e.event_type) + ' ' +
        esc(e.title) + ' · ' + fmtDate(e.next_date) + '</span></div></div>' +
        '<a class="btn btn-small" href="wish.html?connectionId=' + e.connection_id + '&eventId=' + e.id + '">' +
        daysText(e.days_left) + '</a></div>';
    }
    document.getElementById('upcoming').innerHTML = html ||
      '<p class="muted">No events in the next 30 days. <a href="people.html">Add people</a></p>';

    // Recent wishes
    html = '';
    for (const w of d.recentWishes) {
      html += '<div class="list-item"><div><b>' + esc(w.connection_name) + '</b> ' +
        '<span class="tag ' + (w.status === 'SENT' ? 'green' : '') + '">' + w.status + '</span><br>' +
        '<span class="muted">' + esc(w.text.substring(0, 80)) + '...</span></div></div>';
    }
    document.getElementById('recent').innerHTML = html || '<p class="muted">No wishes yet.</p>';
  }
  load();
</script>
</body>
</html>
