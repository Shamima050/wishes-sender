<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WishesSender - Settings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <h1>⚙️ Settings</h1>
    <form id="form" class="card" style="max-width:520px">
      <h2>Profile</h2>
      <label>Name</label><input name="name" required>
      <label>Email</label><input name="email" disabled>

      <h2 style="margin-top:12px">Privacy & AI</h2>
      <label><input type="checkbox" name="ai_enabled"> Allow AI (Gemini) to write my wishes</label><br>
      <label><input type="checkbox" name="share_details"> Share a person's interests & favourite dish with the AI</label><br><br>

      <h2>Reminders</h2>
      <label>Remind me before an event</label>
      <select name="remind_days_before">
        <option value="0">Only on the day</option>
        <option value="1">1 day before (and on the day)</option>
        <option value="3">3 days before (and on the day)</option>
        <option value="7">1 week before (and on the day)</option>
      </select>
      <button type="submit">Save settings</button>
    </form>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  // form.elements gives the inputs by their name attribute
  const form = document.getElementById('form').elements;

  async function start() {
    await loadLayout('settings');
    const s = await api('/api/settings');
    form.name.value = s.name;
    form.email.value = s.email;
    form.ai_enabled.checked = s.ai_enabled;
    form.share_details.checked = s.share_details;
    form.remind_days_before.value = s.remind_days_before;
  }

  document.getElementById('form').onsubmit = async (e) => {
    e.preventDefault();
    await api('/api/settings', 'PUT', {
      name: form.name.value,
      ai_enabled: form.ai_enabled.checked ? 1 : 0,
      share_details: form.share_details.checked ? 1 : 0,
      remind_days_before: form.remind_days_before.value
    });
    toast('Settings saved');
  };
  start();
</script>
</body>
</html>
