# ---------- Server ----------
# (8080 is often used by XAMPP/Apache, so we use 8085)
server.port=8085
# Send error messages to the frontend so it can show them
server.error.include-message=always

# ---------- MySQL ----------
# The database "wishes_sender" is created automatically if it does not exist.
# Change DB_USER / DB_PASSWORD (or edit the defaults after the colon) to match your MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/wishes_sender?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Run schema.sql (tables + views) and data.sql (seed data) on every start.
# Both files are safe to re-run (IF NOT EXISTS / INSERT IGNORE).
spring.sql.init.mode=always

# ---------- Gemini AI ----------
# Never put the real key in this file. Set it as an environment variable:
#   PowerShell:  $env:GEMINI_API_KEY="your-key"
# If no key is set, the app uses wish templates from the database instead.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
